name: Build QuickNovel APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix-ranobes
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restrict ABI to arm64-v8a (CI only)
        run: |
          python3 -c 'p="app/build.gradle"; s=open(p).read(); open(p,"w").write(s.replace("defaultConfig {", "defaultConfig {\n        ndk { abiFilters \"arm64-v8a\" }", 1))'

      - name: Build arm64-v8a Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickNovel-arm64-v8a-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
